name = "zmanim"
main = "src/worker.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# The bundled city list is imported as text.
[[rules]]
type = "Text"
globs = ["**/*.txt"]
fallthrough = true

# 60 requests a minute per client address.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Requests are not logged or stored.
[observability]
enabled = false
